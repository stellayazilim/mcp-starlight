name: publish

# Publishes to npm when a version tag is pushed:
#
#   npm version patch        # bumps package.json and creates the tag
#   git push --follow-tags
#
# Requires a repository secret named NPM_TOKEN — a granular access token with
# "bypass 2FA" enabled and read/write on @stellayazilim/mcp-starlight. A plain
# publish/automation token without the 2FA-bypass flag is rejected by npm when
# the account enforces 2FA.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Check tag matches package version
        # A tag push must carry the version it claims, so `v0.2.0` cannot publish
        # a package.json still on 0.1.0. Skipped for manual runs.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg."
            exit 1
          fi

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
